name: Actualizar RSS de El Confidencial Empresas

on:
  workflow_dispatch:

  schedule:
    # GitHub utiliza UTC.
    # El script controla la hora peninsular y funciona
    # de lunes a sábado entre las 07:00 y las 22:59.
    - cron: "23 5-21 * * 1-6"

permissions:
  contents: write

concurrency:
  group: rss-elconfidencial-empresas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Crear RSS
        run: python rss.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rss.xml

          if git diff --cached --quiet; then
            echo "No hay cambios en el RSS."
          else
            git commit -m "Actualizar RSS de El Confidencial Empresas"
            git push
          fi
